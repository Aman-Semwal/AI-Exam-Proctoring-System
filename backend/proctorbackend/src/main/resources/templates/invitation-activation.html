<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .header { background: #1d4ed8; padding: 32px; text-align: center; }
    .header h1 { color: #fff; margin: 0; font-size: 24px; }
    .body { padding: 32px; color: #333; }
    .body p { line-height: 1.6; }
    .button { display: inline-block; margin: 24px 0; padding: 14px 22px; border-radius: 8px; background: #1d4ed8; color: #fff; text-decoration: none; font-weight: bold; }
    .footer { background: #F9FAFB; padding: 16px 32px; text-align: center; font-size: 12px; color: #9CA3AF; }
    .small { font-size: 13px; color: #6B7280; word-break: break-all; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Complete Your Setup</h1>
  </div>
  <div class="body">
    <p>Hi <strong th:text="${name}">Member</strong>,</p>
    <p>You have been invited to join <strong th:text="${orgName}">your organization</strong> as <strong th:text="${role}">a member</strong>.</p>
    <p>Use the link below to activate your account and set your password.</p>
    <p><a class="button" th:href="${activationLink}" href="#">Set up your password</a></p>
    <p class="small" th:text="${activationLink}">activation link</p>
  </div>
  <div class="footer">
    &copy; <span th:text="${orgName}">Organization</span> &mdash; Powered by ProctorApp
  </div>
</div>
</body>
</html>
