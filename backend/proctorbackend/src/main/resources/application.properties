spring.application.name=proctorbackend
spring.config.import=optional:file:../.env[.properties]

# PostgreSQL / Neon PostgreSQL
# fullstack-guardian: SPRING_DATASOURCE_URL may already contain query parameters
# (e.g. Neon URLs often include ?sslmode=require&channel_binding=require).
# Blindly appending &prepareThreshold=0 produces a malformed URL when the base
# URL has no existing query string, and breaks entirely on some JDBC drivers.
#
# Fix: the environment variable must already include the correct query separator.
# Two accepted patterns:
#   No existing params:  jdbc:postgresql://host/db?prepareThreshold=0
#   Existing params:     jdbc:postgresql://host/db?sslmode=require&prepareThreshold=0
#
# Do NOT append &prepareThreshold=0 here in the properties file — set it directly
# in SPRING_DATASOURCE_URL in your .env so the URL is always well-formed.
# See backend/.env.example for the recommended value.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.type=org.apache.commons.dbcp2.BasicDataSource
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Force all JDBC timestamps to UTC regardless of JVM timezone (BUG-009 fix)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway schema migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# Retry connecting to DB on startup (handles slow cloud DB cold-starts / Supabase resume)
spring.flyway.connect-retries=5
spring.flyway.connect-retries-interval=5s

# Redis
# For a single hosted Redis URL, set SPRING_DATA_REDIS_URL directly instead.
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.username=${SPRING_DATA_REDIS_USERNAME:}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${SPRING_DATA_REDIS_SSL:false}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:5s}
spring.data.redis.timeout=${REDIS_COMMAND_TIMEOUT:3s}
spring.data.redis.repositories.enabled=false

# JWT
spring.security.jwt.secret=${JWT_SECRET}
spring.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# AI Service
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
ai.service.connect-timeout-ms=${AI_SERVICE_CONNECT_TIMEOUT_MS:5000}
ai.service.response-timeout-seconds=${AI_SERVICE_RESPONSE_TIMEOUT_SECONDS:5}

# Frontend URL (used for invitation activation links)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# WebSocket allowed origins (comma-separated)
app.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173}

# Judge0 Code Execution
judge0.api.url=${JUDGE0_API_URL:https://judge0-ce.p.rapidapi.com}
judge0.api.key=${JUDGE0_API_KEY:}
judge0.api.rapidapi-host=${JUDGE0_RAPIDAPI_HOST:judge0-ce.p.rapidapi.com}

# Proctoring
proctoring.violation.critical-threshold=${PROCTORING_CRITICAL_THRESHOLD:5}
# Share of an audio chunk that must be speech to record SPEECH_DETECTED
proctoring.audio.speech-fraction-threshold=${PROCTORING_SPEECH_FRACTION_THRESHOLD:0.3}
# code-reviewer: The comment below has been corrected to match the actual code behavior.
# Frames landing on the identity-check boundary WITHOUT a reference embedding do NOT
# synthesize an IDENTITY_MISMATCH violation — the code logs a warning and continues.
# This is intentional: the backend warns the operator but does not penalise the student
# for a client-side omission (which could be a network blip, not cheating).
# See ProctoringServiceImpl.java processFrame() for the exact behavior.
# Set to 0 to disable the interval check entirely (identity only checked when the
# client explicitly provides a reference_embedding).
proctoring.identity.check-interval-frames=${PROCTORING_IDENTITY_CHECK_INTERVAL_FRAMES:10}

# Mail (SMTP) - leave blank to disable email sending
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
mail.from=${MAIL_FROM:noreply@proctorapp.com}
mail.enabled=${MAIL_ENABLED:false}

# Bootstrap flag — set to false after SUPER_ADMIN has been created
# secure-code-guardian: disabling this closes /api/auth/register permanently
# to reduce attack surface and prevent information leakage.
auth.bootstrap.enabled=${AUTH_BOOTSTRAP_ENABLED:true}

# Demo accounts seeded by migrations (known password). Set false on any shared deployment.
app.seed-accounts.enabled=${SEED_ACCOUNTS_ENABLED:true}

# Async thread pool
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=500
spring.main.allow-bean-definition-overriding=true
