spring.application.name=proctorbackend

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/proctordb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:proctor}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:proctor123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# JWT
spring.security.jwt.secret=${JWT_SECRET:change-this-to-a-strong-secret-key}
spring.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# AI Service
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
