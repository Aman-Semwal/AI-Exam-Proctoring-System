services:

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: proctor
    ports:
      - "5432:5432"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  spring-backend:
    build:
      context: ./proctorbackend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_DATA_REDIS_REPOSITORIES_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/proctor
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_SSL: "false"
      SPRING_DATA_REDIS_PASSWORD: ""
    depends_on:
      - db
      - redis
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "8001:8000"
    dns:
      - 8.8.8.8
      - 1.1.1.1

  # Same image as ai-service, plus pytest/httpx on top (Dockerfile
  # 'test' stage) -- not something that runs standalone, just a way to
  # get a container with the test tooling in it. Run with:
  #   docker-compose run --rm ai-service-test pytest tests/ -v
  ai-service-test:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
      target: test
    dns:
      - 8.8.8.8
      - 1.1.1.1