services:

  spring-backend:
    build:
      context: ./proctorbackend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_DATA_REDIS_REPOSITORIES_ENABLED: "false"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    dns:
      - 8.8.8.8
      - 1.1.1.1
